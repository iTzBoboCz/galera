name: Docker unstable release

on:
  push:
    branches:
      - axum-before-SSO

jobs:
  server:
    name: Build server image
    runs-on: ubuntu-latest

    steps:

      - name: Get commit hash
        id: sha
        run: echo "::set-output name=sha::${GITHUB_SHA::7}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Get commit date
        id: date
        run: |
          COMMIT_DATE=$(git log -1 --format=%ai | cut -d' ' -f1)
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: consider publishing to Docker Hub too
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v1.10.0
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker image
        id: meta
        uses: docker/metadata-action@v5 # Doporučuji v5
        with:
          images: ghcr.io/itzbobocz/galera
          tags: |
            type=raw,value=unstable-axum-before-sso
            type=raw,value=unstable-axum-before-sso.${{ steps.date.outputs.date }}.${{ steps.sha.outputs.sha }}
          flavor: |
            latest=false

      - name: Build images and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
